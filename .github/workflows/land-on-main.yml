name: Land branch work on main

# Anything pushed to an agent branch lands on the default branch by itself. See
# AGENTS.md — "Save straight to my main branch — never a pull request."
#
# If a branch conflicts, this pushes nothing and warns in the log — it does not
# fail, because a failed run emails the owner of this repository and that owner
# was promised they would not have to think about GitHub. No work is lost: the
# branch still holds it, and Of Me says so where they can see it.

on:
  push:
    branches:
      - "claude/**"
      - "codex/**"
      - "agent/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to land on main"
        required: true

permissions:
  contents: write

concurrency:
  # Serialized, never cancelled: a cancelled run would drop somebody's work.
  group: land-on-main
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge the branch into main
        id: merge
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "of-me-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"

          if [ -z "$(git rev-list "HEAD..origin/$BRANCH")" ]; then
            echo "Nothing on $BRANCH that main does not already have."
            echo "landed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff "origin/$BRANCH" -m "Land $BRANCH on main"; then
            git merge --abort || true
            # A NOTICE, NOT A FAILURE, AND THAT IS THE WHOLE POINT.
            #
            # A failed workflow run makes GitHub email the repository owner, and
            # that owner is a member who did not ask to hear from GitHub. The
            # email arrives in developer language, about branches and merges, and
            # describes a state only a developer can leave. One landed in a
            # non-developer's inbox on 2026-08-18 and it was worse than anything
            # else the product can do to somebody.
            #
            # Nothing here is an emergency: nothing was pushed, nothing was lost,
            # and the branch still holds the work. So it exits 0 and says so in
            # the log. Of Me tells them, in our words, on a page they already
            # visit — GitHub is meant to be invisible after the day they link it.
            echo "::warning::$BRANCH could not be landed automatically because it overlaps with a change already in main. Nothing was pushed and nothing was lost — the branch still holds the work, and Of Me will pick it up."
            echo "landed=false" >> "$GITHUB_OUTPUT"
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "landed=true" >> "$GITHUB_OUTPUT"

      # Inline, because the push below starts no further workflow runs.
      - name: Rebuild the derived files
        if: steps.merge.outputs.landed == 'true'
        run: |
          set -euo pipefail
          node scripts/build-derived.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Regenerate derived files"
          fi

      - name: Push main
        if: steps.merge.outputs.landed == 'true'
        run: git push origin HEAD:main
